<div class="login-wrapper">
  <div class="card-login">
    <div class="header-login">
      <h2>Estación Café</h2>
      <p class="subtitulo">Acceso al Módulo de Operaciones y Administración</p>
    </div>

    <!-- Formulario de Credenciales -->
    <div class="seccion-formulario">
      <div class="campo-grupo">
        <label for="rol">Rol de Acceso</label>
        <select id="rol" class="control-select">
          <option value="barista">Barista / Cocina (Comandas)</option>
          <option value="admin">Administrador (Stock y Reportes)</option>
        </select>
      </div>

      <div class="campo-grupo">
        <label for="usuario">Usuario de Empleado</label>
        <input type="text" id="usuario" class="control-input" placeholder="Ej. barista_turno1 o admin_cafe">
      </div>

      <div class="campo-grupo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" class="control-input" placeholder="••••••••">
      </div>
    </div>

    <!-- Panel de Acciones -->
    <div class="seccion-acciones">
      <p class="info-roles">
        * Acceso exclusivo para el personal autorizado. Evita que usuarios externos modifiquen el stock o gestionen pedidos ajenos[cite: 2].
      </p>
      <button type="button" class="btn-ingresar">Iniciar Sesión</button>
    </div>
  </div>
</div>
