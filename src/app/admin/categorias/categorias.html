<header class="d-flex justify-content-between align-items-center mb-7"><div><p class="fg-primary fw-semibold">ADMINISTRACIÓN</p><h1>Categorías</h1></div><button class="btn-solid theme-primary" (click)="open()">Nueva categoría</button></header>
@if (notice) { <p class="alert theme-success" role="status">{{ notice }}</p> } @if (error) { <p class="alert theme-danger" role="alert">{{ error }}</p> }
<section class="card p-7"><app-data-table [headings]="['Nombre', 'Se muestra en postres']" [rows]="rows()" (action)="$event.action === 'Editar' ? open(service.list().find(c => c.id === $event.id)) : remove($event.id)" /></section>
<dialog #editor class="dialog" aria-labelledby="category-title"><div class="dialog-header"><h2 id="category-title">{{ editing ? 'Editar categoría' : 'Nueva categoría' }}</h2><button class="btn-close" aria-label="Cerrar" (click)="editor.close()"></button></div>
<form #form="ngForm" (ngSubmit)="save(form)"><div class="dialog-body"><label class="d-block">Nombre<input class="form-control" name="nombre" [(ngModel)]="draft.nombre" required minlength="2" maxlength="100" #nombre="ngModel"></label>@if (nombre.invalid && nombre.touched) { <small class="fg-danger">Escribe un nombre de al menos 2 caracteres.</small> }
<label class="d-flex gap-3 mt-5"><input class="check" type="checkbox" name="postre" [(ngModel)]="draft.postre">Mostrar en la página de postres</label>@if (error) { <p class="alert theme-danger mt-4">{{ error }}</p> }</div><div class="dialog-footer"><button type="button" class="btn-outline" (click)="editor.close()">Cancelar</button><button class="btn-solid theme-primary" [disabled]="form.invalid">Guardar</button></div></form></dialog>
