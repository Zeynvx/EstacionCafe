<header class="d-flex justify-content-between align-items-center mb-7"><div><p class="fg-primary fw-semibold">ADMINISTRACIÓN</p><h1>Stock de insumos</h1></div><button class="btn-solid theme-primary" (click)="open()">Nuevo insumo</button></header><p>Existencias en una sola ubicación. Las compras recibidas incrementan el stock.</p>@if (notice) { <p class="alert theme-success">{{ notice }}</p> } @if (error) { <p class="alert theme-danger">{{ error }}</p> }
<section class="card p-7"><app-data-table [headings]="['Insumo', 'Existencia', 'Mínimo', 'Estado']" [rows]="rows()" (action)="$event.action === 'Editar' ? open(service.list().find(s => s.id === $event.id)) : remove($event.id)" /></section>
<dialog #editor class="dialog" aria-labelledby="stock-title"><div class="dialog-header"><h2 id="stock-title">{{ editing ? 'Editar insumo' : 'Nuevo insumo' }}</h2><button class="btn-close" aria-label="Cerrar" (click)="editor.close()"></button></div><form #form="ngForm" (ngSubmit)="save(form)"><div class="dialog-body"><label class="d-block">Nombre<input class="form-control" name="nombre" [(ngModel)]="draft.nombre" required minlength="2" maxlength="150"></label><label class="d-block mt-4">Unidad<select class="form-control" name="unidad" [(ngModel)]="draft.unidad" required>@for (unit of units; track unit) { <option [value]="unit">{{ unit }}</option> }</select></label><div class="row g-4 mt-1"><label class="col-6">Existencia<input class="form-control" type="number" name="cantidad" [(ngModel)]="draft.cantidad" min="0" required step="0.001"></label><label class="col-6">Mínimo<input class="form-control" type="number" name="minimo" [(ngModel)]="draft.minimo" min="0" required step="0.001"></label></div>@if (error) { <p class="alert theme-danger mt-4">{{ error }}</p> }</div><div class="dialog-footer"><button type="button" class="btn-outline" (click)="editor.close()">Cancelar</button><button class="btn-solid theme-primary" [disabled]="form.invalid">Guardar</button></div></form></dialog>
