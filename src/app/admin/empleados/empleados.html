<header class="d-flex justify-content-between align-items-center mb-7"><div><p class="fg-primary fw-semibold">ADMINISTRACIÓN</p><h1>Empleados</h1></div><button class="btn-solid theme-primary" (click)="open()">Nuevo empleado</button></header>@if (notice) { <p class="alert theme-success" role="status">{{ notice }}</p> } @if (error) { <p class="alert theme-danger" role="alert">{{ error }}</p> }
<section class="card p-7"><app-data-table [headings]="['Nombre', 'Usuario', 'Correo', 'Rol']" [rows]="rows()" (action)="$event.action === 'Editar' ? open(service.list().find(u => u.id === $event.id)) : remove($event.id)" /></section>
<dialog #editor class="dialog dialog-lg" aria-labelledby="employee-title"><div class="dialog-header"><h2 id="employee-title">{{ editing ? 'Editar empleado' : 'Nuevo empleado' }}</h2><button class="btn-close" aria-label="Cerrar" (click)="editor.close()"></button></div><form #form="ngForm" (ngSubmit)="save(form)"><div class="dialog-body"><div class="row g-4">
<label class="col-12 md:col-6">Nombres<input class="form-control" name="nombre" [(ngModel)]="draft.nombre" (ngModelChange)="changedName()" required minlength="2" maxlength="120"></label><label class="col-12 md:col-6">Apellido paterno<input class="form-control" name="paterno" [(ngModel)]="draft.paterno" (ngModelChange)="changedName()" required maxlength="80"></label><label class="col-12 md:col-6">Apellido materno<input class="form-control" name="materno" [(ngModel)]="draft.materno" maxlength="80"></label>
<label class="col-12 md:col-6">Correo<input class="form-control" type="email" name="correo" [(ngModel)]="draft.correo" required email maxlength="254"></label><label class="col-12 md:col-6">Teléfono<input class="form-control" type="tel" name="telefono" [(ngModel)]="draft.telefono" pattern="[+0-9 ()-]{7,20}"></label><label class="col-12 md:col-6">Rol<select class="form-control" name="rol" [(ngModel)]="draft.rol" required>@for (role of roles; track role) { <option [value]="role">{{ role }}</option> }</select></label>
<label class="col-12 md:col-6">Usuario<input class="form-control" name="usuario" [(ngModel)]="draft.usuario" required pattern="[a-z]+\.[a-z]+[0-9]*"></label><label class="col-12 md:col-6">Dirección<input class="form-control" name="direccion" [(ngModel)]="draft.direccion" maxlength="300"></label><label class="col-12">Contraseña {{ editing ? '(dejar vacía para conservar)' : '' }}<input class="form-control" type="password" name="password" [(ngModel)]="draft.password" [required]="!editing" [minlength]="editing ? 0 : 8" autocomplete="new-password"></label></div>@if (error) { <p class="alert theme-danger mt-4">{{ error }}</p> }</div><div class="dialog-footer"><button type="button" class="btn-outline" (click)="editor.close()">Cancelar</button><button class="btn-solid theme-primary" [disabled]="form.invalid || busy">{{ busy ? 'Guardando…' : 'Guardar empleado' }}</button></div></form></dialog>
