<div class="container-fluid min-vh-100">
  <div class="row">
    <aside class="col-12 lg:col-3 xl:col-2 bg-primary fg-contrast-primary p-7">
      <a routerLink="/admin" class="fg-reset text-decoration-none fw-bold fs-lg">ESTACIÓN CAFÉ</a>
      <p class="fs-sm mt-3">PANEL ADMINISTRATIVO</p>
      <nav class="d-flex flex-wrap lg:flex-column gap-3 my-9" aria-label="Administración">
        @for (s of sections; track s[0]) {
          @if (store.allowed(s[0])) {
            <a
              [routerLink]="'/admin/' + s[0]"
              routerLinkActive="bg-white"
              #active="routerLinkActive"
              [class.fg-primary]="active.isActive"
              [class.fg-contrast-primary]="!active.isActive"
              ariaCurrentWhenActive="page"
              class="d-block p-4 rounded text-decoration-none"
              >{{ s[1] }}</a
            >
          }
        }
      </nav>
      <div class="border-top pt-5">
        <p>
          {{ store.user()?.nombre }}<small class="d-block">{{ store.user()?.rol }}</small>
        </p>
        <a routerLink="/inicio" class="d-block fg-reset mb-5">Ver tienda</a
        ><button class="btn-outline" (click)="logout()">Cerrar sesión</button>
      </div>
    </aside>
    <main class="col-12 lg:col-9 xl:col-10 p-7 lg:p-12">
      @if (store.storageError()) {
        <p class="alert theme-danger" role="alert">{{ store.storageError() }}</p>
      }
      <router-outlet />
    </main>
  </div>
</div>
