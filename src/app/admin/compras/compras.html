<header class="d-flex justify-content-between align-items-center mb-7"><div><p class="fg-primary fw-semibold">ADMINISTRACIÓN</p><h1>Compras a proveedores</h1></div><button class="btn-solid theme-primary" (click)="open()">Nueva compra</button></header>@if (notice) { <p class="alert theme-success">{{ notice }}</p> } @if (error) { <p class="alert theme-danger">{{ error }}</p> }
<section class="card p-7"><app-data-table [headings]="['Proveedor', 'Insumo', 'Cantidad', 'Costo', 'Fecha', 'Recepción']" [rows]="rows()" (action)="action($event)" /></section>
<dialog #editor class="dialog" aria-labelledby="purchase-title"><div class="dialog-header"><h2 id="purchase-title">{{ editing ? 'Editar compra' : 'Registrar compra' }}</h2><button class="btn-close" aria-label="Cerrar" (click)="editor.close()"></button></div><form #form="ngForm" (ngSubmit)="save(form)"><div class="dialog-body"><label class="d-block">Proveedor<select class="form-control" name="proveedor" [(ngModel)]="draft.proveedor" required><option value="">Seleccionar</option>@for (s of store.suppliers(); track s.id) { <option [value]="s.id">{{ s.nombre }}</option> }</select></label><label class="d-block mt-4">Insumo<select class="form-control" name="insumo" [(ngModel)]="draft.insumo" required><option value="">Seleccionar</option>@for (s of store.stock(); track s.id) { <option [value]="s.id">{{ s.nombre }} ({{ s.unidad }})</option> }</select></label><div class="row g-4 mt-1"><label class="col-6">Cantidad<input class="form-control" type="number" name="cantidad" [(ngModel)]="draft.cantidad" min="0.001" step="0.001" required></label><label class="col-6">Costo total (S/)<input class="form-control" type="number" name="costo" [(ngModel)]="draft.costo" min="0" step="0.01" required></label></div><label class="d-block mt-4">Fecha<input class="form-control" type="date" name="fecha" [(ngModel)]="draft.fecha" required></label>@if (error) { <p class="alert theme-danger mt-4">{{ error }}</p> }</div><div class="dialog-footer"><button type="button" class="btn-outline" (click)="editor.close()">Cancelar</button><button class="btn-solid theme-primary" [disabled]="form.invalid">Guardar compra</button></div></form></dialog>
