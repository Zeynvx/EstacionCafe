<header class="d-flex justify-content-between align-items-center mb-7"><div><p class="fg-primary fw-semibold">ADMINISTRACIÓN</p><h1>Carta</h1></div><button class="btn-solid theme-primary" (click)="open()">Nuevo producto</button></header>
@if (notice) { <p class="alert theme-success" role="status">{{ notice }}</p> } @if (error) { <p class="alert theme-danger" role="alert">{{ error }}</p> }
<section class="card p-7"><app-data-table [headings]="['Nombre', 'Categoría', 'Precio actual', 'Descuento', 'Personalizable']" [rows]="rows()" (action)="$event.action === 'Editar' ? open(service.list().find(p => p.id === +$event.id)) : remove($event.id)" /></section>
<dialog #editor class="dialog dialog-lg" aria-labelledby="product-title"><div class="dialog-header"><h2 id="product-title">{{ editing ? 'Editar producto' : 'Nuevo producto' }}</h2><button class="btn-close" aria-label="Cerrar" (click)="editor.close()"></button></div><form #form="ngForm" (ngSubmit)="save(form)"><div class="dialog-body"><div class="row g-4">
<label class="col-12 md:col-6">Nombre<input class="form-control" name="nombre" [(ngModel)]="draft.nombre" required minlength="2" maxlength="150"></label>
<label class="col-12 md:col-6">Categoría<select class="form-control" name="categoria" [(ngModel)]="draft.categoria" required><option value="">Seleccionar</option>@for (c of store.categories(); track c.id) { <option [value]="c.id">{{ c.nombre }}</option> }</select></label>
<label class="col-12">Descripción<textarea class="form-control" name="descripcion" [(ngModel)]="draft.descripcion" required maxlength="1000"></textarea></label>
<label class="col-12">Imagen URL o ruta local<input class="form-control" name="imagen" [(ngModel)]="draft.imagen" required maxlength="1000" placeholder="https://... o /imagen.jpg"></label>
<label class="col-12 md:col-6">Precio (S/)<input class="form-control" type="number" name="precio" [(ngModel)]="draft.precio" required min="0.1" step="0.01"></label>
<label class="col-12 md:col-6">Descuento (%)<input class="form-control" type="number" name="descuento" [(ngModel)]="draft.descuento" required min="0" max="100" step="0.01"></label>
<label class="col-12">Adicionales (nombre:precio separados por coma)<input class="form-control" name="adicionales" [(ngModel)]="draft.adicionales" placeholder="Shot extra:2,Canela:0"></label>
<label class="col-12 d-flex gap-3"><input class="check" type="checkbox" name="personalizable" [(ngModel)]="draft.personalizable">Permitir elegir leche y endulzante</label></div>@if (error) { <p class="alert theme-danger mt-4">{{ error }}</p> }</div><div class="dialog-footer"><button type="button" class="btn-outline" (click)="editor.close()">Cancelar</button><button class="btn-solid theme-primary" [disabled]="form.invalid">Guardar producto</button></div></form></dialog>
