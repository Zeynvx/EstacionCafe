<header class="d-flex justify-content-between align-items-center mb-7"><div><p class="fg-primary fw-semibold">ADMINISTRACIÓN</p><h1>Proveedores</h1></div><button class="btn-solid theme-primary" (click)="open()">Nuevo proveedor</button></header>@if (notice) { <p class="alert theme-success">{{ notice }}</p> } @if (error) { <p class="alert theme-danger">{{ error }}</p> }
<section class="card p-7"><app-data-table [headings]="['Proveedor', 'Correo', 'Teléfono']" [rows]="rows()" (action)="$event.action === 'Editar' ? open(service.list().find(s => s.id === $event.id)) : remove($event.id)" /></section>
<dialog #editor class="dialog" aria-labelledby="supplier-title"><div class="dialog-header"><h2 id="supplier-title">{{ editing ? 'Editar proveedor' : 'Nuevo proveedor' }}</h2><button class="btn-close" aria-label="Cerrar" (click)="editor.close()"></button></div><form #form="ngForm" (ngSubmit)="save(form)"><div class="dialog-body"><label class="d-block">Nombre<input class="form-control" name="nombre" [(ngModel)]="draft.nombre" required minlength="2" maxlength="160"></label><label class="d-block mt-4">Correo<input class="form-control" type="email" name="correo" [(ngModel)]="draft.correo" required email maxlength="254"></label><label class="d-block mt-4">Teléfono<input class="form-control" type="tel" name="telefono" [(ngModel)]="draft.telefono" required pattern="[+0-9 ()-]{7,20}"></label>@if (error) { <p class="alert theme-danger mt-4">{{ error }}</p> }</div><div class="dialog-footer"><button type="button" class="btn-outline" (click)="editor.close()">Cancelar</button><button class="btn-solid theme-primary" [disabled]="form.invalid">Guardar</button></div></form></dialog>
